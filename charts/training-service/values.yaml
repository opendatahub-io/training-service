replicaCount: 1

image:
  repository: quay.io/opendatahub/training-service
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # TokenReview requires the pod to authenticate as its service account.
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Authenticate callers through the Kubernetes TokenReview API. This grants the
# service account only permission to create TokenReview requests.
authentication:
  tokenReview:
    enabled: true

# Runtime configuration is intentionally generic until the authentication,
# authorization, and SDK work defines the service's stable environment names.
env: []
envFrom: []

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080

route:
  enabled: false
  annotations: {}
  host: ""
  path: ""
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

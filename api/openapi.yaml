openapi: 3.0.3
info:
  title: OpenDataHub Training Service Developer Preview API
  description: >
    RHOAI 3.6 GA Developer Preview API for submitting Ray-backed training jobs.
    Requests are scoped to an OpenShift Project. The service is stateless and
    relies on the caller's existing OpenShift identity and RBAC permissions.
    This preview does not expose job lifecycle operations, create or manage Ray
    custom resources/manifests, or provide an operator.
  version: 0.1.0
servers:
  - url: https://taas.openshift.example.com/api/v1
    description: Training Service API
security:
  - bearerAuth: []

paths:
  /training-jobs/estimate:
    post:
      summary: Estimate training resources (stretch goal)
      description: >
        Optional Developer Preview endpoint for theoretical compute, VRAM, and
        runtime estimates. It does not submit a job or access a project.
      operationId: estimateTrainingJob
      tags:
        - Estimations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobEstimationRequest'
      responses:
        '200':
          description: Resource and duration estimation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobEstimationResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /algorithms:
    get:
      summary: List available training algorithms
      description: >
        Returns the algorithms exposed by the installed Training Hub content.
        Discovery is performed through Kubernetes APIs and does not submit or
        manage a job.
      operationId: listAlgorithms
      tags:
        - Discovery
      responses:
        '200':
          description: Catalog of available training algorithms
          content:
            application/json:
              schema:
                type: object
                required:
                  - algorithms
                properties:
                  algorithms:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlgorithmDescriptor'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /projects/{project}/training-jobs:
    post:
      summary: Submit a Ray training job
      description: >
        Submits a training job for the specified OpenShift Project using the
        CodeFlare and Ray SDKs. The service must use the caller's identity and
        existing project permissions. It must not create or manage Ray job
        custom resources or manifests.
      operationId: submitTrainingJob
      tags:
        - Training Submission
      parameters:
        - $ref: '#/components/parameters/Project'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '202':
          description: Training submission accepted by the Ray backend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingJobSubmission'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '409':
          description: A submission with the same name already exists

  /projects/{project}/queues:
    get:
      summary: List available Kueue LocalQueues
      description: >
        Returns queues visible in the specified OpenShift Project. Discovery
        uses Kubernetes APIs directly and does not manage jobs or queues.
      operationId: listQueues
      tags:
        - Discovery
      parameters:
        - $ref: '#/components/parameters/Project'
      responses:
        '200':
          description: Queues accessible in the specified OpenShift Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueInfoResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OpenShift OAuth bearer token for the calling user.

  parameters:
    Project:
      name: project
      in: path
      required: true
      description: Target OpenShift Project name.
      schema:
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      example: team-alpha-ml

  responses:
    '400BadRequest':
      description: Invalid payload or parameter specification
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '401Unauthorized':
      description: Missing or invalid OpenShift bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '403Forbidden':
      description: Caller lacks permission for the requested project or resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    CreateJobRequest:
      type: object
      required:
        - name
        - model
        - dataset
        - algorithm
      properties:
        name:
          type: string
          example: llama3-8b-alpaca-lora
        description:
          type: string
        queue_name:
          type: string
          nullable: true
          description: Optional Kueue LocalQueue in the target project.
          example: team-alpha-local-queue
        model:
          $ref: '#/components/schemas/ModelSpec'
        dataset:
          $ref: '#/components/schemas/DatasetSpec'
        algorithm:
          $ref: '#/components/schemas/AlgorithmSpec'
        resources:
          $ref: '#/components/schemas/ResourceSpec'
        output:
          $ref: '#/components/schemas/OutputSpec'

    JobEstimationRequest:
      type: object
      required:
        - model
        - dataset
        - algorithm
      properties:
        model:
          $ref: '#/components/schemas/ModelSpec'
        dataset:
          $ref: '#/components/schemas/DatasetSpec'
        algorithm:
          $ref: '#/components/schemas/AlgorithmSpec'
        resources:
          $ref: '#/components/schemas/ResourceSpec'

    ModelSpec:
      type: object
      required:
        - source
        - uri
      properties:
        source:
          type: string
          enum: [huggingface, s3, pvc, oci]
          example: huggingface
        uri:
          type: string
          example: meta-llama/Llama-3.2-3B
        secret_ref:
          type: string
          description: Secret reference in the target project containing access tokens.
          example: hf-secret-token

    DatasetSpec:
      type: object
      required:
        - source
        - uri
      properties:
        source:
          type: string
          enum: [huggingface, s3, pvc, http]
          example: huggingface
        uri:
          type: string
          example: tatsu-lab/alpaca
        split:
          type: string
          default: train
        secret_ref:
          type: string

    AlgorithmSpec:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: >
            Built-in algorithm identifier exposed by GET /algorithms, such as
            lora_sft, qlora_sft, sft, or dpo.
          example: lora_sft
        parameters:
          type: object
          additionalProperties: true
          description: Hyperparameter overrides for the selected algorithm.
          example:
            learning_rate: 0.0002
            num_train_epochs: 3
            per_device_train_batch_size: 4
            lora_r: 16
            lora_alpha: 32

    ResourceSpec:
      type: object
      description: Requested compute resources for the submitted job.
      properties:
        num_nodes:
          type: integer
          minimum: 1
          default: 1
          example: 2
        gpus_per_node:
          type: integer
          minimum: 0
          default: 1
          example: 4
        gpu_type:
          type: string
          example: nvidia.com/gpu
        cpus_per_node:
          type: string
          default: "8"
          example: "16"
        memory_per_node:
          type: string
          default: "32Gi"
          example: "64Gi"

    OutputSpec:
      type: object
      properties:
        destination_uri:
          type: string
          example: s3://my-ml-bucket/checkpoints/llama3-lora/
        secret_ref:
          type: string

    TrainingJobSubmission:
      type: object
      required:
        - submission_id
        - name
        - project
        - selected_backend
        - status
      properties:
        submission_id:
          type: string
          description: Ray submission identifier returned by the submission backend.
          example: job-9a8f2b1c
        name:
          type: string
          example: llama3-8b-alpaca-lora
        project:
          type: string
          example: team-alpha-ml
        queue_name:
          type: string
          nullable: true
          example: team-alpha-local-queue
        selected_backend:
          type: string
          enum: [ray]
          example: ray
        status:
          type: string
          enum: [SUBMITTED]
          example: SUBMITTED
        submitted_at:
          type: string
          format: date-time

    JobEstimationResponse:
      type: object
      properties:
        recommended_resources:
          $ref: '#/components/schemas/ResourceSpec'
        estimated_duration_seconds:
          type: integer
          example: 3600
        estimated_cost_usd:
          type: number
          format: float
          example: 12.50
        gpu_memory_required_gb_per_device:
          type: number
          example: 22.4
        warnings:
          type: array
          items:
            type: string
          example:
            - Full fine-tuning on 1 GPU may cause OOM.

    QueueInfoResponse:
      type: object
      required:
        - kueue_enabled
        - queues
      properties:
        kueue_enabled:
          type: boolean
          example: true
        queues:
          type: array
          items:
            $ref: '#/components/schemas/QueueInfo'

    QueueInfo:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: team-alpha-local-queue
        cluster_queue:
          type: string
          example: gpu-cluster-queue
        pending_jobs:
          type: integer
          example: 1
        quota_status:
          type: object
          additionalProperties: true
          example:
            nvidia.com/gpu:
              used: 8
              max: 16

    AlgorithmDescriptor:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: lora_sft
        description:
          type: string
          example: Low-Rank Adaptation Supervised Fine-Tuning
        supported_backends:
          type: array
          items:
            type: string
            enum: [ray]
          example: [ray]
        parameter_schema:
          type: object
          additionalProperties: true

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          example: 403
        message:
          type: string
          example: Caller lacks permission in OpenShift Project team-alpha-ml.
